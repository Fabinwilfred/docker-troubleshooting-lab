version: "3.9"

services:
  reverse-proxy:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - frontend-network
      - backend-network

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:5000
    ports:
      - "3000:3000"
    networks:
      - frontend-network

  api:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_USER: appuser
      DB_PASSWORD: example
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    ports:
      - "5000:5000"
    volumes:
      - api-data:/app/data
    depends_on:
      - mysql
      - redis
    networks:
      - backend-network

  worker:
    build: ./worker
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - redis
      - rabbitmq
    networks:
      - backend-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: example
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      retries: 5
    networks:
      - backend-network

  redis:
    image: redis:7
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
      - "5672:5672"
    networks:
      - backend-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.1
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    networks:
      - logging

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-network

volumes:
  mysql-data:
  redis-data:
  postgres-data:
  grafana-storage:
  api-data:

networks:
  frontend-network:
  backend-network:
  monitoring:
  logging:
